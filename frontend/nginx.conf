# Keep the original scheme when another TLS-terminating proxy sits in front of nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # The API builds the Authentik redirect_uri from these headers.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Image uploads (the API limits each image to 5 MB; nginx's default is 1 MB).
        client_max_body_size 10m;

        # The OIDC callback sets large (chunked) auth cookies.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Vite outputs hashed file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: unknown paths (/admin, /login...) are handled by React Router.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
